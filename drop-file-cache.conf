; Railway counts the kernel's cache of files this container has touched as the
; service's memory, and with no memory pressure it is never freed: with one
; station on air the metric shows ~0.66 GB for ~0.37 GB of real use, mostly
; cached app files (PHP sources, GeoIP database, Liquidsoap stdlib) and media.
; Drop it every 15 minutes; a pass takes about a quarter of a CPU second.
[program:drop-file-cache]
command=/bin/sh -c 'while sleep 900; do nice -n 19 drop-file-cache /data /tmp /var /usr; done'
autostart=true
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true
